      let questions = [];
      let index = 0;
      let score = 0;
      let answers = [];
      function startQuiz(shuffle) {
        questions = JSON.parse(JSON.stringify(originalQuestions));
        if (shuffle) questions.sort(() => Math.random() - 0.5);
        index = 0;
        score = 0;
        answers = [];
        document.getElementById("startScreen").style.display = "none";
        document.getElementById("quizScreen").style.display = "block";
        showQuestion();
      }
      function showQuestion() {
        const q = questions[index];
        document.getElementById("progress").textContent =
          `Question ${index + 1} of ${questions.length} | Score: ${score}`;
        document.getElementById("question").textContent =
          `Q${q.num}. ${q.question}`;
        const form = document.getElementById("options");
        form.innerHTML = "";
        const isMulti = q.answer.includes(",");
        q.options.forEach((opt) => {
          const label = document.createElement("label");
          label.className = "option";
          const input = document.createElement("input");
          input.type = isMulti ? "checkbox" : "radio";
          input.name = "answer";
          input.value = opt.letter;
          label.appendChild(input);
          label.appendChild(
            document.createTextNode(` ${opt.letter}. ${opt.text}`),
          );
          form.appendChild(label);
        });
        document.getElementById("feedback").style.display = "none";
        document.getElementById("checkBtn").style.display = "inline-block";
        document.getElementById("nextBtn").style.display = "none";
      }
      function selectedAnswer() {
        return Array.from(document.querySelectorAll("#options input:checked"))
          .map((x) => x.value)
          .sort()
          .join(",");
      }
      function answerText(q) {
        const letters = q.answer.split(",");
        return letters
          .map(
            (l) =>
              `${l}. ${(q.options.find((o) => o.letter === l) || { text: "" }).text}`,
          )
          .join(" | ");
      }
      function checkAnswer() {
        const q = questions[index];
        const sel = selectedAnswer();
        const fb = document.getElementById("feedback");
        if (!sel) {
          alert("Choose an answer first.");
          return;
        }
        const correct = sel === q.answer.split(",").sort().join(",");
        if (correct) {
          score++;
          fb.className = "feedback correct";
          fb.textContent = `Correct ✅ Answer: ${answerText(q)}`;
        } else {
          fb.className = "feedback wrong";
          fb.textContent = `Wrong ❌ Correct answer: ${answerText(q)}`;
        }
        answers.push({
          num: q.num,
          question: q.question,
          selected: sel,
          correct: q.answer,
          isCorrect: correct,
        });
        fb.style.display = "block";
        document.getElementById("checkBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "inline-block";
      }
      function nextQuestion() {
        index++;
        if (index >= questions.length) return showResults();
        showQuestion();
      }
      function showResults() {
        document.getElementById("quizScreen").style.display = "none";
        const pct = Math.round((score / questions.length) * 100);
        let html = `<h1>Results</h1><h2>${score} / ${questions.length} (${pct}%)</h2>`;
        html +=
          '<button class="primary" onclick="location.reload()">Restart</button><h2>Review</h2>';
        answers.forEach((a) => {
          html += `<div class="resultItem"><b>Q${a.num}</b> - ${a.isCorrect ? "✅" : "❌"} Your answer: ${a.selected} | Correct: ${a.correct}</div>`;
        });
        const rs = document.getElementById("resultScreen");
        rs.innerHTML = html;
        rs.style.display = "block";
      }

      function toggleDark() {
        document.body.classList.toggle("dark");

        const themeText = document.getElementById("themeText");
        const themeIcon = document.getElementById("themeIcon");
        const btn = document.querySelector(".dark-toggle button");

        if (document.body.classList.contains("dark")) {
          themeText.textContent = "☀️ Light Mode";
          themeIcon.textContent = "☀️";

          btn.classList.add("dark");
          btn.classList.remove("light");
        } else {
          themeText.textContent = "🌙 Dark Mode";
          themeIcon.textContent = "🌙";

          btn.classList.add("light");
          btn.classList.remove("dark");
        }
      }
    </script>
